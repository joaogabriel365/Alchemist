<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | ALCHEMIST 3D</title>
    <meta name="description" content="Catalogo de produtos de impressao 3D com filtros por categoria, preco e busca inteligente.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/styles.css') }}">
</head>
<body data-page="products">
    <header class="site-header" data-header></header>

    <main class="shop" data-shop>
        <div class="container">
            <header class="shop-head">
                <nav class="shop-breadcrumb" aria-label="Voce esta em">
                    <a href="{{ url_for('index') }}">Início</a>
                    <span aria-hidden="true">/</span>
                    <span aria-current="page">Produtos</span>
                </nav>
                <div class="shop-head-row">
                    <div>
                        <h1 class="shop-title">Produtos</h1>
                        <p class="shop-subtitle">Peças impressas em 3D sob demanda, com acabamento feito à mão.</p>
                    </div>
                    <p class="shop-count" data-results-count aria-live="polite"></p>
                </div>
            </header>
        </div>

        <div class="shop-toolbar" id="categories">
            <div class="container shop-toolbar-inner">
                <div class="shop-tabs" role="tablist" aria-label="Categorias" data-shop-tabs></div>
                <div class="shop-controls">
                    <label class="shop-search">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                        <input type="search" placeholder="Buscar produtos" aria-label="Buscar produtos" data-product-search>
                        <kbd aria-hidden="true">/</kbd>
                    </label>
                    <label class="shop-select">
                        <span class="sr-only">Faixa de preço</span>
                        <select data-shop-price aria-label="Faixa de preço">
                            <option value="all">Qualquer preço</option>
                            <option value="0-50">Até R$ 50</option>
                            <option value="50-100">R$ 50 a R$ 100</option>
                            <option value="100-150">R$ 100 a R$ 150</option>
                            <option value="150-">Acima de R$ 150</option>
                        </select>
                    </label>
                    <label class="shop-select">
                        <span class="sr-only">Ordenar por</span>
                        <select data-shop-sort aria-label="Ordenar por">
                            <option value="relevance">Relevância</option>
                            <option value="price-asc">Menor preço</option>
                            <option value="price-desc">Maior preço</option>
                            <option value="name">Nome (A–Z)</option>
                            <option value="rating">Mais bem avaliados</option>
                        </select>
                    </label>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="shop-active" data-shop-active hidden></div>
            <div class="shop-grid" data-products-grid></div>

            <aside class="shop-custom">
                <div>
                    <h2>Não encontrou o que procura?</h2>
                    <p>Modelamos e imprimimos peças sob medida a partir da sua ideia ou referência.</p>
                </div>
                <a class="shop-custom-link" href="{{ url_for('custom') }}">Solicitar projeto personalizado <span aria-hidden="true">→</span></a>
            </aside>
        </div>
    </main>

    <div class="shop-toast" role="status" aria-live="polite" data-shop-toast hidden></div>

    <footer class="site-footer" data-footer></footer>
    <button class="back-to-top" type="button" aria-label="Voltar ao topo" data-back-to-top>↑</button>
    <script>window.__FLASK_USER__ = {{ flask_user | tojson }};</script>
    {%- if produtos_json is defined %}
    <script>window.__DB_PRODUCTS__ = {{ produtos_json | safe }};</script>
    {%- endif %}
    <script src="{{ url_for('static', filename='assets/js/app.js') }}"></script>
</body>
</html>

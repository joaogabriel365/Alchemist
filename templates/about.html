<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre | ALCHEMIST 3D</title>
    <meta name="description" content="Conheca o conceito da ALCHEMIST 3D e a fusao entre alquimia, tecnologia e design industrial.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/styles.css') }}">
</head>
<body data-page="about">
    <header class="site-header" data-header></header>

    <style>
        .about-wrapper {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 6rem 1.5rem;
        }

        /* glow radial de fundo */
        .about-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 50% 40%, rgba(244,122,32,0.10) 0%, transparent 70%),
                radial-gradient(ellipse 40% 30% at 20% 80%, rgba(244,122,32,0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        /* linhas decorativas laterais */
        .about-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(244,122,32,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(244,122,32,0.06) 1px, transparent 1px);
            background-size: 80px 80px;
            pointer-events: none;
        }

        .about-content {
            position: relative;
            z-index: 1;
            max-width: 820px;
            text-align: center;
        }

        .about-eyebrow {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        .about-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
            color: #fff;
        }

        .about-divider {
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 1.5rem auto 2.5rem;
            border-radius: 2px;
        }

        .about-text {
            font-size: clamp(1.05rem, 2vw, 1.25rem);
            line-height: 1.9;
            color: var(--text-secondary, #a0aec0);
            max-width: 700px;
            margin: 0 auto;
        }
    </style>

    <main class="page-spacer">
        <div class="about-wrapper">
            <div class="about-content reveal">
                <span class="about-eyebrow">Nossa história</span>
                <h1 class="about-title">{{ about_titulo }}</h1>
                <div class="about-divider"></div>
                <p class="about-text">{{ about_descricao }}</p>
            </div>
        </div>
    </main>

    <footer class="site-footer" data-footer></footer>
    <button class="back-to-top" type="button" aria-label="Voltar ao topo" data-back-to-top>↑</button>
    <script>window.__FLASK_USER__ = {{ flask_user | tojson }};</script>
    <script src="{{ url_for('static', filename='assets/js/app.js') }}"></script>
</body>
</html>

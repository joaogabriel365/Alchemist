<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | ALCHEMIST 3D</title>
    <meta name="description" content="Entre em contato com a ALCHEMIST 3D por formulario ou WhatsApp.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="contact">
    <header class="site-header" data-header></header>

    <main class="page-spacer">
        <section class="section-block">
            <div class="container contact-layout">
                <div class="contact-copy reveal">
                    <span class="eyebrow">CONTATO</span>
                    <h2>Converse com a equipe e tire duvidas tecnicas</h2>
                    <p>Use o formulario para briefing detalhado ou fale direto no WhatsApp para atendimento rapido.</p>
                    <a class="whatsapp-button" href="https://wa.me/5500000000000" target="_blank" rel="noreferrer">Abrir WhatsApp</a>
                </div>

                <div class="contact-card glass-panel reveal">
                    <h3>Formulario</h3>
                    <form class="form-grid" data-contact-request-form>
                        <div class="field">
                            <label for="contact-name">Nome</label>
                            <input id="contact-name" name="name" type="text" placeholder="Seu nome">
                        </div>
                        <div class="field">
                            <label for="contact-email">Email</label>
                            <input id="contact-email" name="email" type="email" placeholder="voce@email.com">
                        </div>
                        <div class="field">
                            <label for="contact-subject">Assunto</label>
                            <input id="contact-subject" name="subject" type="text" placeholder="Sobre o que voce precisa falar?">
                        </div>
                        <div class="field">
                            <label for="contact-message">Mensagem</label>
                            <textarea id="contact-message" name="message" placeholder="Descreva sua duvida ou projeto."></textarea>
                        </div>
                        <div class="form-feedback" data-contact-feedback hidden></div>
                        <button class="button button-primary" type="submit">Enviar mensagem</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer" data-footer></footer>
    <button class="back-to-top" type="button" aria-label="Voltar ao topo" data-back-to-top>↑</button>
    <script src="assets/js/app.js"></script>
</body>
</html>
